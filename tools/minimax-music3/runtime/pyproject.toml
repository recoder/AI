[project]
name = "minimax-music3-runtime"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.15.0",
    "diffusers==0.40.0",
    "markdown-it-py==4.0.0",
    "pyyaml==6.0.2",
    "soundfile==0.13.1",
    "torch==2.7.1+cu128",
    "transformers==5.13.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
