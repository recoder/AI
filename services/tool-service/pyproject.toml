[project]
name = "local-tool-service"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
  # Keep the supported SDK v1 interface stable; upgrades are explicit lockfile changes.
  "mcp>=1.30,<2",
  "pyyaml>=6,<7",
  "markdown-it-py>=3,<5",
  "soundfile>=0.13,<1",
  "pywin32>=310; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
