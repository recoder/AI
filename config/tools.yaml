version: 1
tools:
  minimax-music3:
    generation: MiniMax Music 3
    backend: diffusers-modular
    path: apps/minimax-music3
    runtime: native
    python: '3.11.13'
    runtime_project: tools/minimax-music3/runtime
    model_path: models/music/minimax-music3
    runtime_settings:
      device: cuda
      dtype: bfloat16
      component_offload: true
      language_model_group_offload: leaf_level
      group_offload_stream: true
      timeout_seconds: 10800
    defaults:
      seed: 42
      duration_seconds: 30
      steps: 30
      tool_options:
        output_format: wav
  ace-step:
    generation: ACE-Step 1.5
    backend: official-python-api
    repo: https://github.com/ACE-Step/ACE-Step-1.5.git
    branch: main
    revision: ca1e85fe9430179831e6bc6be790c332190a3866
    path: apps/ace-step-1.5
    entrypoint: acestep/inference.py
    runtime: native
    python: '3.11.13'
    model_path: models/music/ace-step
    runtime_settings:
      device: cuda
      dit_model: acestep-v15-xl-sft
      fallback_dit_model: acestep-v15-turbo
      lm_model: acestep-5Hz-lm-1.7B
      lm_backend: vllm
      offload_to_cpu: true
      offload_dit_to_cpu: true
      quantization: int8_weight_only
      compile_model: true
      timeout_seconds: 3600
    defaults:
      seed: 42
      duration_seconds: 30
      steps: 50
      guidance_scale: 7.0
      temperature: 0.85
      top_k: 0
      top_p: 0.9
      tool_options:
        thinking: true
        shift: 1.0
        infer_method: ode
        output_format: wav
  yue:
    generation: YuE2
    backend: wan2gp
    repo: https://github.com/deepbeepmeep/Wan2GP.git
    branch: main
    revision: bfaff285463ef6124c2357136e8d36c6c93c0fb2
    path: apps/wan2gp
    entrypoint: models/TTS/yue2/pipeline.py
    runtime: native
    python: '3.11.13'
    model_path: models/music/yue2
    runtime_settings:
      profile: 4
      vae_tile_size: 256
      timeout_seconds: 1800
      budgets:
        text_encoder: 5000
        transformer: 4000
        '*': 3000
    defaults:
      seed: 42
      duration_seconds: 30
      steps: 32
      guidance_scale: 1.0
      temperature: 1.0
      top_k: 100
      top_p: 0.95
      tool_options:
        planning: full
